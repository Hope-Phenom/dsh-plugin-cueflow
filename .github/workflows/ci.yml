name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit and API tests
        run: pnpm test

      - name: Build client bundle
        run: pnpm build

      - name: Build standalone UI
        run: pnpm ui:build

      - name: Render UI screenshots
        run: pnpm ui:shot

      - name: Playwright canvas E2E
        run: pnpm e2e

      - name: Graph benchmark
        run: pnpm bench

      - name: Concurrent run benchmark
        run: pnpm bench:runs

      - name: Pack dry run
        run: pnpm pack --dry-run

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cueflow-screenshots
          path: .screenshots
          if-no-files-found: ignore
